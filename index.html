<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Video Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Background me subtle grid pattern ke liye */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-[#0B0F19] text-white font-sans min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Background Glow Effects -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600 rounded-full blur-[150px] opacity-20 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-cyan-500 rounded-full blur-[150px] opacity-10 pointer-events-none"></div>

    <!-- Navbar -->
    <nav class="w-full px-6 py-5 flex justify-between items-center z-10 border-b border-white/5 backdrop-blur-md">
        <div class="flex items-center gap-2 cursor-pointer">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-cyan-400 flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </div>
            <span class="text-xl font-bold tracking-wider">Fast<span class="text-blue-500">DL</span></span>
        </div>
        <div class="hidden md:flex gap-6 text-sm text-gray-400 font-medium">
            <a href="#" class="hover:text-white transition-colors">Home</a>
            <a href="#" class="hover:text-white transition-colors">How it works</a>
            <a href="#" class="hover:text-white transition-colors">FAQ</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-16 z-10">
        
        <!-- Badge -->
        <div class="mb-6 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold tracking-wide uppercase">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            Fastest & Secure Downloader
        </div>

        <!-- Heading -->
        <h1 class="text-4xl md:text-6xl font-extrabold text-center leading-tight mb-4">
            Download Videos in <br class="hidden md:block" />
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">High Quality</span>
        </h1>
        
        <p class="text-gray-400 text-center max-w-2xl mb-10 text-sm md:text-base">
            Paste your link below to download videos from YouTube, Instagram, Facebook, and more. No ads, no waiting.
        </p>

        <!-- Main Download Box (Glassmorphism Card) -->
        <div class="w-full max-w-3xl bg-[#111827]/80 backdrop-blur-xl border border-gray-800 rounded-2xl p-2 md:p-3 shadow-2xl shadow-blue-500/10">
            
            <!-- Input Field Wrapper -->
            <div class="flex flex-col md:flex-row gap-2">
                
                <!-- Input Box with Paste Button -->
                <div class="relative flex-grow flex items-center bg-[#1F2937] rounded-xl border border-gray-700 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30 transition-all overflow-hidden">
                    
                    <!-- Link Icon -->
                    <div class="pl-4 text-gray-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>

                    <input 
                        type="text" 
                        placeholder="Paste video URL here (e.g., https://youtube.com/...)" 
                        class="w-full bg-transparent text-white px-4 py-4 outline-none placeholder-gray-500 text-sm md:text-base"
                    >
                    
                    <!-- Paste Button inside input -->
                    <button class="absolute right-2 px-3 py-1.5 md:px-4 md:py-2 bg-gray-700/50 hover:bg-gray-600/80 border border-gray-600 text-xs md:text-sm font-medium rounded-lg transition-colors text-gray-300 hover:text-white">
                        Paste
                    </button>
                </div>

                <!-- Download Button -->
                <button class="bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] hover:shadow-[0_0_30px_rgba(59,130,246,0.6)] flex items-center justify-center gap-2 whitespace-nowrap">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download
                </button>

            </div>

            <!-- Supported Platforms -->
            <div class="mt-4 flex flex-wrap justify-center items-center gap-4 text-gray-500 text-sm border-t border-gray-800 pt-4">
                <span class="text-xs uppercase tracking-wider text-gray-600 font-semibold">Works on:</span>
                <!-- Aap yahan original SVG icons use kar sakte hain, abhi text use kar raha hu -->
                <span class="hover:text-white cursor-pointer transition-colors font-medium flex items-center gap-1">▶ YouTube</span>
                <span class="hover:text-white cursor-pointer transition-colors font-medium flex items-center gap-1">📸 Instagram</span>
                <span class="hover:text-white cursor-pointer transition-colors font-medium flex items-center gap-1">📘 Facebook</span>
                <span class="hover:text-white cursor-pointer transition-colors font-medium flex items-center gap-1">🐦 Twitter</span>
            </div>

        </div>

    </main>
</body>
</html>
